name: "Set theme labels"

on:
  - pull_request_target

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Note: actions/labeler v5 is the latest stable release (uses Node 20).
      # When a Node 24-compatible release becomes available, update this reference.
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
